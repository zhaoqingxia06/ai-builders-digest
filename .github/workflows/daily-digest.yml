name: daily-digest

on:
  schedule:
    - cron: '20 0 * * *' # 08:20 Beijing time (00:20 UTC), after the local 8:00 run
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: fetch feed
        run: node scripts/prepare-digest.js > feed.json

      - name: remix + merge
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: node scripts/remix.mjs

      - name: build site
        run: node site/build.mjs

      - name: commit & push
        run: |
          git config user.name "digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "digest $(date -u +%F)"
            git push
          fi
