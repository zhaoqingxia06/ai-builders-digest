name: daily-digest

on:
  schedule:
    # 中转站（zarazhangrui/follow-builders）每天北京时间 ~14:47 落盘新快照；
    # 15:00 / 15:30 / 16:30 三班紧跟其后抢新料（remix 对同一快照不重生成，
    # 没新料的班次是秒级空跑，只花 Actions 时间不花 LLM）；其余班次补漏兜底。
    # （UTC = 北京 - 8h）
    - cron: '0 22 * * *'   # 06:00 Beijing
    - cron: '0 2 * * *'    # 10:00 Beijing
    - cron: '0 4 * * *'    # 12:00 Beijing
    - cron: '0 7 * * *'    # 15:00 Beijing — 第一时间抢中转站新快照
    - cron: '30 7 * * *'   # 15:30 Beijing — 中转站偶尔拖到 ~15:02，再抢一次
    - cron: '0 8 * * *'    # 16:00 Beijing
    - cron: '30 8 * * *'   # 16:30 Beijing — 兜底中转站最晚落盘（曾拖到 16:22）
    - cron: '0 12 * * *'   # 20:00 Beijing
    - cron: '0 16 * * *'   # 24:00 Beijing
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: fetch feed
        run: node scripts/prepare-digest.js > feed.json

      - name: remix + merge
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: node scripts/remix.mjs

      - name: build site
        run: node build.mjs

      - name: verify latest edition
        # 红灯 = 站点没有今天/昨天的期号（如 DeepSeek 欠费、上游 feed 为空），
        # 失败邮件会发到仓库所有者，避免"网站停在旧一期"无人察觉
        run: node scripts/verify-fresh.mjs

      - name: commit & push
        run: |
          git config user.name "digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "digest $(date -u +%F)"
            git push
          fi
